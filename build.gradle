plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }
}

gradle.projectsEvaluated {
    project(':forge').tasks.named('publishMods') {
        mustRunAfter project(':fabric').tasks.named('publishMods')
    }

    project(':neoforge').tasks.named('publishMods') {
        mustRunAfter project(':forge').tasks.named('publishMods')
    }
}