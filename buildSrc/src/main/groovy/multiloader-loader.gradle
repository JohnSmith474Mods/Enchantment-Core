plugins {
    id 'multiloader-common'
    id 'me.modmuss50.mod-publish-plugin'
}

java {
    withSourcesJar()
    withJavadocJar()
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

publishMods {
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE
    dryRun = gradle.startParameter.taskNames.contains("dryRunPublish")

    def targetMcVer = project.name == 'forge' ? rootProject.minecraft_version_forge : rootProject.minecraft_version

    modLoaders.add(project.name)

    modrinth {
        accessToken = System.getenv("MODRINTH_TOKEN") ?: "mock_token"
        projectId = System.getenv("MODRINTH_PROJECT_ID") ?: "mock_id"
        environment = CLIENT_AND_SERVER

        // Modrinth-specific naming
        displayName = "${rootProject.mod_name} ${rootProject.version}"
        version = "${rootProject.version}+${targetMcVer}-${project.name}"

        minecraftVersionRange {
            start = targetMcVer
            end = rootProject.minecraft_version_supremum
        }

        requires {
            id = rootProject.config_overhauled_project_id
            version = "${rootProject.config_overhauled_version}+${targetMcVer}-${project.name}"
        }

        additionalFile(javadocJar) {
            type = JAVADOC_JAR
        }
        additionalFile(sourcesJar) {
            type = SOURCES_JAR
        }
    }

    curseforge {
        accessToken = System.getenv("CURSEFORGE_TOKEN") ?: "mock_token"
        projectId = System.getenv("CURSEFORGE_PROJECT_ID") ?: "mock_id"

        displayName = "${rootProject.version}+${targetMcVer}-${project.name}"
        version = "${rootProject.mod_name} ${rootProject.version}"

        minecraftVersionRange {
            start = targetMcVer
            end = rootProject.minecraft_version_supremum
        }

        javaVersions.add(JavaVersion.toVersion(rootProject.java_version))

        client = true
        server = true

        requires(rootProject.config_overhauled_project_name)

        changelog = rootProject.file("CHANGELOG.md").text
        changelogType = "markdown"
    }
}

tasks.register("dryRunPublish") {
    group = "publishing"
    description = "Validates the deployment payload using mock credentials."
    dependsOn tasks.named("publishMods")
}