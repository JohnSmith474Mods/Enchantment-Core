description=Enchantment Core is a data-driven library framework facilitating dynamic enchantment configuration and volumetric spell field execution.\
\n\
\n\
\n\Key Features:\
\n- Component Library:\
\n\     Access an extensive suite of pre-defined enchantment effects, volumetric shapes, and target evaluators.\
\n\
\n- Modular Spell Fields:\
\n\     Execute volume-based entity, block, and visual effects using bounded spatial geometries and topological falloff algorithms.\
\n\
\n- Configuration Integration:\
\n\     Bridge vanilla JSON definitions with dynamic configuration backends utilizing custom map codecs.\
\n\
\n- Data Transformation Pipeline:\
\n\     Import and export static enchantment parameters into configurable runtime structures.\
\n\
\n- Mathematical Value Codecs:\
\n\     Implement non-linear polynomial and diminishing returns functions within the LevelBasedValue ecosystem.
